name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pas de `version:` ici : pnpm/action-setup lit déjà "packageManager"
      # (pnpm@10.33.2) dans package.json. Spécifier les deux à la fois fait
      # échouer l'action (versions jugées en conflit, même compatibles).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dette de 129 erreurs assumée (cf. CLAUDE.md) — non bloquant pour l'instant.
      - run: pnpm lint || true

      - run: pnpm test
