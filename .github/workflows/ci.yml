name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : aucun secret de production requis pour compiler.
      DATABASE_URL: postgresql://docbel:docbel@127.0.0.1:5432/docbel_ci
      DIRECT_URL: postgresql://docbel:docbel@127.0.0.1:5432/docbel_ci
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      BOOKING_NRN_SECRET: ci-only-nrn-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Pas de `version:` ici : pnpm/action-setup lit déjà "packageManager"
      # (pnpm@10.33.2) dans package.json. Spécifier les deux à la fois fait
      # échouer l'action (versions jugées en conflit, même compatibles).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Baseline explicite de la dette : toute erreur supplémentaire bloque.
      - run: pnpm lint --suppressions-location .github/eslint-suppressions.json

      - run: pnpm test

      - run: pnpm i18n:check

      - run: pnpm build
